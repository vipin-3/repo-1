<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance to Mumbai</title>
    <style>
        /* Add a beautiful background image */
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin-top: 50px;
            background-image: url('https://images.unsplash.com/photo-1529253355930-ddbe423a2ac7?q=80&w=2665&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'); /* Replace with your static image link */
            background-size: cover;
            background-position: center;
            color: white;
            padding: 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Reduce text size and spacing */
        #distance {
            font-size: 1.5rem;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6);
            width: 80%;
            max-width: 300px;
            margin-top: 20px;
        }

        button {
            font-size: 1.2rem;
            padding: 10px 20px;
            margin-top: 30px;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background-color: #e67e22;
        }

        /* 3D Arrow style */
        #arrow {
            width: 100px;
            height: 100px;
            margin-top: 40px;
            background-color: #f39c12;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center;
            transition: transform 0.5s ease-in-out;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.7);
        }

        #arrow:before {
            content: '→'; /* Arrow character */
            font-size: 3rem;
            color: white;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* 3D effect on hover */
        #arrow:hover {
            transform: scale(1.2) rotateZ(10deg);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <p id="distance">Loading...</p>
    <div id="arrow"></div>
    <button onclick="location.reload()">Get Distance Again</button>

    <script>
        // Function to calculate distance between two points using Haversine formula
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the Earth in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = R * c; // Distance in km
            return distance;
        }

        // Function to calculate the bearing between two points
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            lat1 = lat1 * Math.PI / 180;
            lat2 = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * 180 / Math.PI;
            return bearing;
        }

        // Coordinates of Mumbai
        const cityLat = 19.0760;
        const cityLon = 72.8777;

        // Check if geolocation is available
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;
                
                // Calculate the distance
                const distance = calculateDistance(userLat, userLon, cityLat, cityLon);
                
                // Update the page with the distance
                document.getElementById('distance').textContent = `You are ${distance.toFixed(2)} km away from Mumbai.`;

                // Calculate the bearing to Mumbai and rotate the arrow
                const bearing = calculateBearing(userLat, userLon, cityLat, cityLon);
                document.getElementById('arrow').style.transform = `rotate(${bearing}deg)`;
            }, function() {
                alert("Geolocation failed or is not supported by your browser.");
            });
        } else {
            alert("Geolocation is not supported by this browser.");
        }
    </script>
</body>
</html>
